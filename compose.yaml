name: counter-inspect

x-python-service: &python-service
  image: counter-inspect:1.0.0
  build:
    context: .
    dockerfile: Dockerfile
  platform: linux/arm64
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777
  extra_hosts:
    - host.docker.internal:host-gateway
  healthcheck:
    test: ["CMD", "python", "-m", "counter_inspect.health", "/tmp/counter-health", "15"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s

services:
  mqtt-bridge:
    <<: *python-service
    command: ["python", "-m", "counter_inspect.bridge"]
    user: "10001:10001"
    # Rootless/user-namespaced Docker may leave the named-volume key owned by
    # group 0. Supplementary group 0 grants read access without running as root.
    group_add:
      - "0"
    volumes:
      - ./config:/config:ro
      - counter_secret_key:/key:ro
      - ./logs:/data/logs
      - ./state/queue:/data/queue

  ota-handler:
    <<: *python-service
    command: ["python", "-m", "counter_inspect.ota"]
    user: "10001:10001"
    group_add:
      - "0"
    volumes:
      - ./config:/config:ro
      - counter_secret_key:/key:ro
      - ./logs:/data/logs
      - ./updates:/data/updates

  scanner-inspect:
    <<: *python-service
    command: ["python", "-m", "counter_inspect.scanner"]
    # The dedicated X11 cookie directory remains read-only. Mounting its
    # directory, rather than the cookie file, allows xauth to replace the file
    # atomically when the kiosk session restarts.
    user: "10001:10001"
    group_add:
      - "0"
    # Xauthority local-family cookies are keyed by hostname. Match the host so
    # python-xlib can authenticate over the mounted Unix-domain socket.
    hostname: "${X11_HOSTNAME:-armbian}"
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      XAUTHORITY: /run/xauth/Xauthority
    volumes:
      - ./config:/config:ro
      - counter_secret_key:/key:ro
      - ./logs:/data/logs
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${XAUTHORITY_DIR:-/etc/counter-inspect/xauth}
        target: /run/xauth
        read_only: true
        bind:
          create_host_path: false

  updates-http:
    image: nginx:1.27.3-alpine
    platform: linux/arm64
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${OTA_HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./updates:/srv/updates:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  counterctl:
    <<: *python-service
    entrypoint: ["python", "-m", "counter_inspect.cli"]
    user: "0:0"
    # UID 0 manages the named key volume. Supplementary group 10001 grants
    # access to the setgid host configuration and data directories when Docker
    # user namespaces prevent container root from bypassing host permissions.
    group_add:
      - "10001"
    restart: "no"
    read_only: false
    profiles:
      - tools
    environment:
      COUNTER_KIOSK_DIR: /host/kiosk
    volumes:
      - ./config:/config
      - counter_secret_key:/key
      - ./logs:/data/logs
      - ./state/queue:/data/queue
      - ./updates:/data/updates
      # This narrow host bind lets the CLI manage the existing kiosk URL and
      # signal the host-side systemd path unit installed by setup-kiosk.sh.
      - type: bind
        source: /etc/kiosk
        target: /host/kiosk
        bind:
          create_host_path: false
    healthcheck:
      disable: true

volumes:
  counter_secret_key:
